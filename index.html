<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>YouTube to MP3 - Fast Converter</title>
  <style>
    :root {
      --bg-color: #0f172a;
      --card-bg: #1e293b;
      --text: #f8fafc;
      --primary: #3b82f6;
      --primary-hover: #2563eb;
      --success: #22c55e;
      --border: #334155;
    }

    body {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
      background-color: var(--bg-color);
      color: var(--text);
      display: flex;
      justify-content: center;
      align-items: center;
      min-height: 100vh;
      margin: 0;
      padding: 20px;
    }

    .container {
      background-color: var(--card-bg);
      border: 1px solid var(--border);
      border-radius: 12px;
      padding: 2rem;
      width: 100%;
      max-width: 500px;
      box-shadow: 0 10px 25px -5px rgba(0, 0, 0, 0.5);
    }

    h1 {
      font-size: 1.5rem;
      margin-top: 0;
      margin-bottom: 1.5rem;
      text-align: center;
      color: #fff;
    }

    .input-group {
      display: flex;
      flex-direction: column;
      gap: 0.5rem;
      margin-bottom: 1.5rem;
    }

    label {
      font-size: 0.875rem;
      color: #94a3b8;
    }

    input[type="text"] {
      padding: 0.75rem;
      border-radius: 6px;
      border: 1px solid var(--border);
      background-color: #0f172a;
      color: #fff;
      font-size: 1rem;
      outline: none;
    }

    input[type="text"]:focus {
      border-color: var(--primary);
    }

    button {
      background-color: var(--primary);
      color: white;
      border: none;
      border-radius: 6px;
      padding: 0.75rem;
      font-size: 1rem;
      font-weight: 600;
      cursor: pointer;
      transition: background-color 0.2s;
    }

    button:hover:not(:disabled) {
      background-color: var(--primary-hover);
    }

    button:disabled {
      opacity: 0.6;
      cursor: not-allowed;
    }

    .status-box {
      margin-top: 1.5rem;
      padding: 1rem;
      border-radius: 6px;
      background-color: #0f172a;
      border: 1px solid var(--border);
      font-size: 0.875rem;
      text-align: center;
    }

    .download-area {
      margin-top: 1.5rem;
      text-align: center;
    }

    .download-btn {
      display: inline-block;
      background-color: var(--success);
      color: white;
      text-decoration: none;
      padding: 0.75rem 1.5rem;
      border-radius: 6px;
      font-weight: 600;
      transition: opacity 0.2s;
    }

    .download-btn:hover {
      opacity: 0.9;
    }
  </style>
</head>
<body>

  <div class="container">
    <h1>Converter YouTube em MP3</h1>

    <div class="input-group">
      <label for="yt-url">Cole o Link do Vídeo:</label>
      <input type="text" id="yt-url" placeholder="https://www.youtube.com/watch?v=..." />
      <button id="start-btn">Converter para MP3</button>
    </div>

    <div id="status-container" class="status-box" style="display: none;">
      <div id="status-text">Aguardando início...</div>
    </div>

    <div id="download-container" class="download-area" style="display: none;">
      <a id="download-link" class="download-btn" target="_blank" rel="noopener noreferrer">Baixar Arquivo MP3</a>
    </div>
  </div>

  <script>
    const urlInput = document.getElementById('yt-url');
    const startBtn = document.getElementById('start-btn');
    const statusContainer = document.getElementById('status-container');
    const statusText = document.getElementById('status-text');
    const downloadContainer = document.getElementById('download-container');
    const downloadLink = document.getElementById('download-link');

    function updateStatus(msg) {
      statusContainer.style.display = 'block';
      statusText.innerText = msg;
    }

    async function startConversion() {
      const url = urlInput.value.trim();
      if (!url) {
        alert('Por favor, cole um link do YouTube válido.');
        return;
      }

      startBtn.disabled = true;
      downloadContainer.style.display = 'none';
      updateStatus('Solicitando conversão para MP3...');

      try {
        // Chamada direta para a Cobalt API solicitando o formato MP3
        const response = await fetch('https://api.cobalt.tools/api/json', {
          method: 'POST',
          headers: {
            'Accept': 'application/json',
            'Content-Type': 'application/json'
          },
          body: JSON.stringify({
            url: url,
            downloadMode: 'audio',
            audioFormat: 'mp3',
            isAudioOnly: true
          })
        });

        const data = await response.json();

        if (!data || data.status === 'error' || !data.url) {
          throw new Error((data && data.text) ? data.text : 'Falha ao processar o vídeo. Verifique a URL.');
        }

        // Configura o botão com o link direto do MP3
        downloadLink.href = data.url;
        downloadContainer.style.display = 'block';
        updateStatus('Pronto! Clique no botão abaixo para baixar.');

      } catch (err) {
        console.error(err);
        updateStatus(`Erro: ${err.message}`);
      } finally {
        startBtn.disabled = false;
      }
    }

    startBtn.addEventListener('click', startConversion);
  </script>
</body>
</html>
